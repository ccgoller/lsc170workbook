project:
  type: book
  output-dir: _book

book:
  title: "LSC 170: Microbial Superheroes"
  subtitle: "Course Workbook"
  author: "Carlos C. Goller"
  favicon: "images/Microbial Superheroes course logo.png"
  sidebar:
    logo: "images/Microbial Superheroes course logo.png"
    style: docked
    search: true
  page-navigation: true
  downloads: [pdf, epub]
  repo-url: https://github.com/ccgoller/lsc170workbook
  navbar:
    left:
      - icon: book
        href: index.qmd
        text: Home
  chapters:
    - index.qmd
    - about.qmd
    - background.qmd
    - module-1.qmd
    - module-2.qmd
    - module-3.qmd
    - module-4.qmd
    - module-5.qmd
    - module-6.qmd
    - module-7.qmd
    - references.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    code-fold: false
    link-external-icon: false
    lang: en
    number-sections: false
    search: true
  pdf:
    documentclass: scrbook
    toc: true
  epub:
    toc: true
