project:
  type: book
  output-dir: _book

book:
  title: "LSC 170: Microbial Superheroes"
  subtitle: "Course Workbook"
  author: "Carlos C. Goller"
  favicon: "images/Microbial Superheroes course logo.png"
  sidebar:
    logo: "images/Microbial Superheroes course logo.png"
    style: docked
    search: true
  navbar:
    pinned: true
    collapse-below: lg
    left:
      - text: "Home"
        href: index.qmd
      - text: "Section 1: Malaria"
        menu:
          - text: "Module 1: Getting Started"
            href: module-1.qmd
          - text: "Module 2: Introduction"
            href: module-2.qmd
          - text: "Module 3: Methods"
            href: module-3.qmd
          - text: "Module 4: Figures 1-3"
            href: module-4.qmd
          - text: "Module 5: Later figures"
            href: module-5.qmd
          - text: "Module 6: Discussion"
            href: module-6.qmd
          - text: "Module 7: Next experiment"
            href: module-7.qmd
      - text: "Section 2: Sand flies"
        menu:
          - text: "Section overview"
            href: sandfly-intro.qmd
          - text: "Module 1: Getting Started"
            href: sandfly-module-1.qmd
          - text: "Module 2: Introduction"
            href: sandfly-module-2.qmd
          - text: "Module 3: Methods"
            href: sandfly-module-3.qmd
          - text: "Module 4: Figures 1-3"
            href: sandfly-module-4.qmd
          - text: "Module 5: Figures 4-6"
            href: sandfly-module-5.qmd
          - text: "Module 6: Discussion"
            href: sandfly-module-6.qmd
          - text: "Module 7: Next experiment"
            href: sandfly-module-7.qmd
      - text: "Knowledge checks"
        href: knowledge-checks.qmd
      - text: "Appendix"
        menu:
          - text: "A: Methods and techniques"
            href: appendix-methods.qmd
          - text: "References"
            href: references.qmd
  page-navigation: true
  downloads: [pdf, epub]
  page-footer:
    center:
      - text: "<i class='bi bi-github'></i> GitHub repository"
        href: https://github.com/ccgoller/lsc170workbook
        aria-label: "GitHub repository"
  chapters:
    - index.qmd
    - about.qmd
    - background.qmd
    - knowledge-checks.qmd
    - part: "Section 1: Delftia and Malaria"
      chapters:
        - module-1.qmd
        - module-2.qmd
        - module-3.qmd
        - module-4.qmd
        - module-5.qmd
        - module-6.qmd
        - module-7.qmd
    - part: "Section 2: Sand Flies and Leishmania"
      chapters:
        - sandfly-intro.qmd
        - sandfly-module-1.qmd
        - sandfly-module-2.qmd
        - sandfly-module-3.qmd
        - sandfly-module-4.qmd
        - sandfly-module-5.qmd
        - sandfly-module-6.qmd
        - sandfly-module-7.qmd
  appendices:
    - appendix-methods.qmd
    - references.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles-dark.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    code-fold: false
    link-external-icon: false
    lang: en
    number-sections: false
    search: true
  pdf:
    documentclass: scrbook
    toc: true
  epub:
    toc: true
