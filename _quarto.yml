project:
  type: book
  output-dir: _book

book:
  title: "LSC 170: Microbial Superheroes"
  subtitle: "Course Workbook"
  author: "LSC 170 Teaching Team"
  favicon: images/logo.svg
  sidebar:
    logo: images/logo.svg
    style: docked
    search: true
  page-navigation: true
  repo-url: https://github.com/ccgoller/lsc170workbook
  chapters:
    - index.qmd
    - background.qmd
    - module-1.qmd
    - module-2.qmd
    - module-3.qmd
    - module-4.qmd
    - module-5.qmd
    - module-6.qmd
    - module-7.qmd
    - lab-module-1.qmd
    - references.qmd

format:
  html:
    theme:
      light: [cosmo, styles.scss]
    toc: true
    toc-title: "On this page"
    toc-depth: 2
    code-fold: false
    link-external-icon: false
    lang: en
    number-sections: false
